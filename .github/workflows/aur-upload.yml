name: Publish to AUR

# Thin dispatcher: rust-app-release dispatches here with version_name,
# we delegate to the shared reusable (desktop entry + icon included).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, no v prefix (e.g., 0.2.9)'
        required: true

jobs:
  update-aur:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@v1
    with:
      pkgname: soredowe-bin
      pkgdesc: "Experimental GUI for pacman/AUR users who prefer it (Wayland/Vulkan)"
      binary-name: soredowe-${{ inputs.version_name }}-x86_64-unknown-linux-gnu.tar.gz
      binary-name-aarch64: soredowe-${{ inputs.version_name }}-aarch64-unknown-linux-gnu.tar.gz
      app-name: "soredowe"
      license: "GPL-3.0-only"
      depends: "polkit wayland vulkan-icd-loader fontconfig hicolor-icon-theme git"
      optdepends: "'yay: for installing from AUR'"
      provides: "soredowe"
      conflicts: "soredowe"
      desktop-comment: "GUI for pacman/AUR users who prefer it (Wayland/Vulkan)"
      desktop-categories: "System;PackageManager;"
      icon-url: "https://raw.githubusercontent.com/mlm-games/soredowe/main/packaging/icons/hicolor/scalable/apps/soredowe.svg"
      version: ${{ inputs.version_name }}
      maintainer-name: "MLM-stuff"
      maintainer-email: "gfxoxinzh@mozmail.com"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
